[project]
name = "trading-research-engine"
version = "0.1.0"
description = "A research system that happens to trade. Phase 1a: execution telemetry."
requires-python = ">=3.11"
dependencies = [
    "ctrader-open-api>=0.9.2",
    "service_identity>=24.1",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    # Bayesian state estimation for the rung-7 models. The owner's own published package
    # (ubunye-ai-ecosystems/tfilterspy), so this adds no third-party modelling dependency.
    # Verified not to disturb the protobuf 3.20.1 pin that ctrader-open-api requires.
    "tfilterspy>=1.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Council LLM backend. Claude via the anthropic SDK; Gemini via REST (requests, a core dep)
# to avoid google-generativeai's protobuf>=5 pin, which conflicts with ctrader-open-api.
llm = ["anthropic>=0.120", "pypdf>=4.0"]   # server-side refusal fallbacks and effort need a recent SDK
# Dashboard web service (Render free tier).
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "anthropic>=0.120"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
# Flat top-level packages; run modules with `python -m telemetry.logger`.
packages = ["config", "connection", "telemetry", "ledger", "risk", "backtest",
            "strategy", "market", "report", "analysis", "research", "council", "scout",
            "dashboard", "learning", "ops", "news"]
