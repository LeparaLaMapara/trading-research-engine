[project]
name = "trading-research-engine"
version = "0.1.0"
description = "A research system that happens to trade. Phase 1a: execution telemetry."
requires-python = ">=3.11"
dependencies = [
    "ctrader-open-api>=0.9.2",
    "service_identity>=24.1",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Real Council/Scout backends. Without these (or their keys) the engine uses the mock backend.
llm = ["anthropic>=0.40", "google-generativeai>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
# Flat top-level packages; run modules with `python -m telemetry.logger`.
packages = ["config", "connection", "telemetry", "ledger", "risk", "backtest",
            "strategy", "market", "report", "analysis", "research", "council", "scout"]
