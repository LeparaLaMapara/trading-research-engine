name: research

# Free scheduled research on GitHub Actions (Render's free tier has no workers/cron/disk).
# Since 2026-09-22: refreshes the account snapshot and bar history, reports the research
# programme's status, and runs the self-audit. It does NOT test strategies (docs/programme).
on:
  schedule:
    - cron: "0 5 * * *"     # daily 05:00 UTC (07:00 SAST)
  workflow_dispatch: {}       # manual "Run workflow" button

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ENV: live
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      TOKEN_STORE: data/tokens.json
      RESEARCH_PERIOD: D1   # H1 costs 20-30x more for the same rule; every H1 rule was over the cost ceiling
      SUPABASE_URL: https://bprargrqppufeuewryze.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the audit reads git history to check pre-registration order
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore accumulated memory (registry, calibration, bars, telemetry)
        uses: actions/cache@v4
        with:
          path: data
          key: research-data-${{ github.run_id }}
          restore-keys: |
            research-data-
      - name: Install
        run: pip install -e .
      - name: Snapshot account balance -> Supabase
        run: |
          # The self-check needs the balance to judge "can it still trade". It was UNKNOWN
          # every day because nothing handed it over.
          python -m market.account > account.log 2>&1 || true   # kept out of the log: public repo
          B=$(grep -o "balance=[0-9.]*" account.log | head -1 | cut -d= -f2)
          if [ -n "$B" ]; then echo "ACCOUNT_BALANCE_USD=$B" >> "$GITHUB_ENV"; fi
      - name: Refresh bar history
        run: |
          # Since 2026-09-22 this job no longer tests strategies. The daily search re-tested the
          # same five rules every day, they failed every day, and each repeat raised the bar a
          # real idea must clear later. Research now happens as pre-registered experiments
          # (docs/programme). This job keeps the data fresh and runs the self-check.
          set +e
          OK=0
          for S in EURUSD USDJPY XAUUSD; do
            echo "::group::fetch bars $S"
            python -m market.bars --symbol "$S" --period "$RESEARCH_PERIOD" --days 30 | tee "bars_$S.log"
            grep -q "^stored [1-9]" "bars_$S.log" && OK=$((OK+1))
            echo "::endgroup::"
          done
          set -e
          echo "symbols refreshed: $OK of 3"
          if [ "$OK" -eq 0 ]; then
            echo "::error::No bar history could be refreshed. The broker connection is broken."
            exit 1
          fi
      - name: Research programme status
        run: python -m research.programme
      - name: Self-check
        # Runs last and is allowed to fail the whole job. Deterministic, no model in the path,
        # so nothing can argue it down. This is the step that would have caught the five weeks
        # of green-but-dead runs. `if: always()` because a broken cycle is exactly when the
        # audit matters most.
        if: always()
        run: python -m ops.audit
