name: research

# Free scheduled research on GitHub Actions (Render's free tier has no workers/cron/disk).
# Runs one council + backtest cycle on a schedule and on manual dispatch. The Failure
# Registry and calibration scoreboard persist between runs via the Actions cache.
on:
  schedule:
    - cron: "0 5 * * *"     # daily 05:00 UTC (07:00 SAST)
  workflow_dispatch: {}       # manual "Run workflow" button

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ENV: live
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      TOKEN_STORE: data/tokens.json
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COUNCIL_ANTHROPIC_MODEL: claude-opus-5
      COUNCIL_GEMINI_MODEL: gemini-2.5-flash
      RESEARCH_PERIOD: H1
      RESEARCH_ROUNDS: "6"
      SUPABASE_URL: https://bprargrqppufeuewryze.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore accumulated memory (registry, calibration, bars, telemetry)
        uses: actions/cache@v4
        with:
          path: data
          key: research-data-${{ github.run_id }}
          restore-keys: |
            research-data-
      - name: Install
        run: pip install -e ".[llm]"
      - name: Snapshot account balance -> Supabase
        run: python -m market.account || true
      - name: Run one research cycle
        run: |
          # Individual symbols may fail (broker hiccup, thin data) without failing the run,
          # but the cycle as a whole must produce something. Until 2026-09-15 this step ended
          # in a bare `exit 0`, so forty days of runs that tested NOTHING reported success.
          set +e
          for S in EURUSD USDJPY XAUUSD; do
            echo "::group::fetch bars $S"
            python -m market.bars --symbol "$S" --period "$RESEARCH_PERIOD" --days 180
            echo "::endgroup::"
          done
          for S in EURUSD USDJPY XAUUSD; do
            echo "::group::experiment $S"
            python -m research.experiment --symbol "$S" --period "$RESEARCH_PERIOD" --rounds "$RESEARCH_ROUNDS" \
              | tee "cycle_$S.log"
            echo "::endgroup::"
          done
          set -e
          echo "::group::cycle health"
          TESTED=$(grep -ho "deflating against N=[0-9]* candidates ever scored ([0-9]* tested this run)" cycle_*.log \
                   | sed -E 's/.*\(([0-9]+) tested this run\)/\1/' | paste -sd+ - | bc)
          TESTED=${TESTED:-0}
          echo "candidates actually backtested this cycle: $TESTED"
          if [ "$TESTED" -eq 0 ]; then
            echo "::error::Research cycle tested 0 candidates. The loop is not learning."
            echo "Every proposal was rejected or skipped before the backtest stage. Check the"
            echo "failure registry tabu rules and the council output before trusting any"
            echo "later run. Failing deliberately so this cannot hide behind a green tick."
            exit 1
          fi
          echo "::endgroup::"
      - name: Self-check
        # Runs last and is allowed to fail the whole job. Deterministic, no model in the path,
        # so nothing can argue it down. This is the step that would have caught the five weeks
        # of green-but-dead runs. `if: always()` because a broken cycle is exactly when the
        # audit matters most.
        if: always()
        run: python -m ops.audit
